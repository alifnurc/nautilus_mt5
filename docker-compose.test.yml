version: '3.8'
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - PYTHONPATH=/app/src
      - TEST_ENV=true
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./reports:/app/reports
    command: >
      sh -c "pytest tests/ --cov=src --junitxml=reports/junit.xml --cov-report=html:reports/coverage"

  test-ci:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - PYTHONPATH=/app/src
      - CI=true
    command: >
      sh -c "pytest tests/ --cov=src --cov-fail-under=80"

